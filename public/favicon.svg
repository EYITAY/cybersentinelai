<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cyber Sentinel AI">
  <defs>
    <linearGradient id="csCyan" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="clipCircle">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0B1220"/>

  <!-- Mark (female profile + hacker hat) -->
  <g clip-path="url(#clipCircle)">
    <!-- Subtle glow ring -->
    <circle cx="32" cy="32" r="29" fill="none" stroke="url(#csCyan)" stroke-width="1.5" opacity="0.55"/>

    <!-- Hair / head silhouette (left-facing profile) -->
    <path
      d="M25.2 44.2c-2.6-2.2-4.2-5.4-4.2-8.9 0-6.6 5.4-12 12-12 4.3 0 8.0 2.2 10.1 5.7 1.0 1.6 1.5 3.4 1.5 5.3 0 2.6-.9 5.0-2.4 6.9-1.5 1.9-3.7 3.3-6.2 3.9-1.3.3-2.7.4-4.1.2-2.8-.3-5.5-1.5-7.6-3.1-.3.1-1.4.6-2.9.6-1.2 0-2.3-.3-3.2-.6z"
      fill="#0F172A"
      opacity="0.95"
    />

    <!-- Face outline + neck (cyan stroke) -->
    <path
      d="M35.9 26.2c-2.9.3-5.5 1.9-7.1 4.2-1.3 1.8-1.9 4.0-1.6 6.3.2 1.6.9 3.1 1.9 4.3 1.0 1.2 2.4 2.1 3.9 2.6 1.2.4 2.5.5 3.7.3 1.7-.3 3.2-1.1 4.4-2.3 1.3-1.3 2.1-3.0 2.3-4.8"
      fill="none"
      stroke="url(#csCyan)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Nose + lips hint -->
    <path d="M39.6 34.7c-.8.4-1.6.6-2.4.6" fill="none" stroke="url(#csCyan)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M39.0 37.8c-.9.6-2.1.9-3.4.8" fill="none" stroke="url(#csCyan)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Hacker hat (fedora-ish) -->
    <path
      d="M22.5 27.4c6.1-4.0 13.6-5.6 21.1-4.5 2.0.3 3.8.8 5.6 1.5 1.0.4 1.6 1.5 1.4 2.6l-.8 4.1c-.2 1.0-1.1 1.8-2.2 1.8H25.4c-1.1 0-2.0-.7-2.2-1.8l-.8-3.4c-.2-.9.2-1.8 1.0-2.3z"
      fill="#111827"
      stroke="url(#csCyan)"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path
      d="M18.0 33.0c6.1 2.1 12.6 3.1 19.1 3.0 6.6-.1 13.1-1.3 19.1-3.5"
      fill="none"
      stroke="url(#csCyan)"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- CS letters on hat -->
    <text
      x="38.2"
      y="29.8"
      text-anchor="middle"
      font-size="10"
      font-weight="800"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
      fill="#E5E7EB"
      style="letter-spacing: 0.5px;"
    >CS</text>
  </g>
</svg>

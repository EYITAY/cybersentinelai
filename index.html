    <style>
      html {
        scroll-behavior: smooth;
      }
      /* For custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #111827; /* gray-900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; /* gray-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; /* gray-500 */
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }

      .bg-grid-gray-700\/\[0\.2\] {
        background-image: linear-gradient(to right, rgba(55, 65, 81, 0.2) 1px, transparent 1px), linear-gradient(to bottom, rgba(55, 65, 81, 0.2) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
        animation: fade-in-up 0.6s ease-out forwards;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { translateY(0px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes neon-pulse {
        0%, 100% {
          box-shadow: 0 0 5px #a855f7, 0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #9333ea;
        }
        50% {
          box-shadow: 0 0 10px #c084fc, 0 0 20px #c084fc, 0 0 40px #c084fc, 0 0 80px #a855f7;
        }
      }
      .animate-neon-pulse {
        animation: neon-pulse 4s ease-in-out infinite;
      }

      @keyframes neon-pulse-cyan {
        0%, 100% {
          box-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee, 0 0 20px #22d3ee, 0 0 40px #06b6d4;
        }
        50% {
          box-shadow: 0 0 10px #67e8f9, 0 0 20px #67e8f9, 0 0 40px #67e8f9, 0 0 80px #22d3ee;
        }
      }
      .animate-neon-pulse-cyan {
        animation: neon-pulse-cyan 4s ease-in-out infinite;
      }
    </style>
